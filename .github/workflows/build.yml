name: Build & publish Kirana OS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kirana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev git curl unzip xz-utils python3 librsvg2-bin grub-common sassc fonts-inter fontconfig
      - name: Build Kirana packages
        run: bash packaging/build.sh
      - name: Fetch third-party packages (fastfetch, starship)
        run: bash packaging/third-party.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist
      - name: Install kirana-desktop on clean Ubuntu 24.04
        run: |
          apt-get update -qq
          apt-get install -y -qq lsb-release systemd >/dev/null
          apt-get install -y ./dist/kirana-*_all.deb ./dist/fastfetch_*_amd64.deb ./dist/starship_*_amd64.deb
      - name: Verify
        run: |
          set -e
          . /etc/os-release
          test "$ID" = kirana && echo "os-release: $PRETTY_NAME"
          test "$(lsb_release -is)" = Kirana && echo "lsb_release: Kirana"
          dpkg-divert --list | grep -c kirana-branding
          test -f /etc/dconf/db/local && echo "dconf defaults compiled"
          glib-compile-schemas --dry-run /usr/share/glib-2.0/schemas && echo "gsettings schemas valid"
          test -d /usr/share/themes/Kirana/gnome-shell
          test -d /usr/share/gnome-shell/extensions/tilingshell@ferrarodomenico.com
          kirana version
          kirana-theme --list
          starship --version | head -1
          fastfetch --version
          dpkg --verify kirana-branding kirana-themes kirana-tools kirana-desktop kirana-vm
      - name: Remove cleanly
        run: |
          set -e
          apt-get purge -y kirana-desktop kirana-branding kirana-themes kirana-tools kirana-vm
          . /etc/os-release
          test "$ID" = ubuntu && echo "os-release restored: $PRETTY_NAME"
          ! dpkg-divert --list | grep kirana-branding
          echo "uninstall OK"

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          echo "SIGNING_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build signed APT repository
        run: |
          sudo apt-get install -y -qq apt-utils
          bash repo/make-repo.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Kirana OS $GITHUB_REF_NAME" --generate-notes

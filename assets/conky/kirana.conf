-- Kirana OS desktop widget (conky) - built by vianziro
conky.config = {
  alignment = 'top_left', gap_x = 90, gap_y = 150,
  minimum_width = 520, maximum_width = 520,
  own_window = true, own_window_type = 'desktop', own_window_class = 'Conky',
  own_window_transparent = true, own_window_argb_visual = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, draw_shades = true, default_shade_color = '0B0E26', draw_outline = false, draw_borders = false,
  use_xft = true, font = 'Inter:size=11', override_utf8_locale = true,
  update_interval = 1, cpu_avg_samples = 2,
  default_color = 'E6E4FF', color1 = '3EE0D0', color2 = 'FFB27A', color3 = 'C9C6F0',
  default_bar_width = 240, default_bar_height = 4,
}

conky.text = [[
${color2}${font Inter Medium:size=14}${execi 60 /etc/kirana/greet.sh}${font}
${voffset -6}${color}${font Inter Display Thin:size=92}${time %H:%M}${font}
${voffset 4}${color1}${font Inter Light:size=17}${execi 60 LC_TIME=id_ID.UTF-8 date '+%A, %d %B %Y'}${font}
${voffset 16}${color3}${font Inter SemiBold:size=10}SISTEM${font}
${color}CPU   ${color1}${cpubar cpu0}${color}  ${cpu cpu0}%
${color}RAM   ${color1}${membar}${color}  ${mem}
${color}DISK  ${color1}${fs_bar /}${color}  ${fs_used /}
${color}UP    ${color}${uptime_short}${goto 200}${color3}BOOT ${color1}${execi 3600 systemd-analyze | awk -F'= ' '/Startup/{print $2}'}
${color}SWAP  ${color}zram ${swap} / ${swapmax}
${voffset 16}${color3}${font Inter SemiBold:size=9}KIRANA OS 1.0 · SENJA   ${color2}●${color3}   BUILT BY VIANZIRO${font}
]]
